name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Application & Pre-generate Assets
        run: |
          npm run build
          node scripts/generate-icons.js

      - name: Setup Capacitor Android
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "gradlew missing or incomplete, initializing clean Android platform..."
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Inject Android App Icons, Permissions & Audio Drivers
        run: |
          node scripts/prepare-android.js

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            echo "Keystore decoded successfully."
          else
            echo "Warning: KEYSTORE_BASE64 secret not found."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          validate-wrappers: false

      - name: Build Release APK with Gradle
        run: |
          cd android
          gradle assembleRelease --no-daemon

      - name: Sign APK with V1, V2, V3 Schemes
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'dovashi' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'dovashi123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'dovashi123' }}
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          
          if [ -f "android/app/release.keystore" ] && [ -f "$APK_PATH" ]; then
            echo "Signing APK with full V1, V2, V3 signature protection..."
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
              --ks android/app/release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out Dovashi-Release.apk \
              "$APK_PATH"
            echo "Signed APK created: Dovashi-Release.apk"
          else
            echo "Copying unsigned APK..."
            cp "$APK_PATH" Dovashi-Release.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dovashi-Release-APK
          path: Dovashi-Release.apk
          retention-days: 30
