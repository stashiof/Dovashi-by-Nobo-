name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Inject Google Web Client ID
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID || '348785349910-o3e8g44mvdn85t03l8b7k8q29g65r1u9.apps.googleusercontent.com' }}
        run: |
          sed -i "s/348785349910-o3e8g44mvdn85t03l8b7k8q29g65r1u9.apps.googleusercontent.com/$GOOGLE_WEB_CLIENT_ID/g" capacitor.config.json
          sed -i "s/348785349910-o3e8g44mvdn85t03l8b7k8q29g65r1u9.apps.googleusercontent.com/$GOOGLE_WEB_CLIENT_ID/g" src/utils/nativeGoogleAuth.ts
          sed -i "s/348785349910-o3e8g44mvdn85t03l8b7k8q29g65r1u9.apps.googleusercontent.com/$GOOGLE_WEB_CLIENT_ID/g" scripts/prepare-android.js

      - name: Build Web Application & Pre-generate Assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://tmekinimlxdpdgkqbyjw.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
        run: |
          npm run build
          node scripts/generate-icons.js

      - name: Setup Capacitor Android
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "gradlew missing or incomplete, initializing clean Android platform..."
            rm -rf android
            npx cap add android
          fi
          npx cap sync android
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Inject Android App Icons, Permissions & Audio Drivers
        run: |
          node scripts/prepare-android.js
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Ensure Release Keystore and Print SHA-1 Fingerprint
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'dovashi' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'dovashi123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'dovashi123' }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            echo "Decoded keystore from GitHub Secret KEYSTORE_BASE64."
          elif [ -f "keystore/release.keystore" ]; then
            cp keystore/release.keystore android/app/release.keystore
            echo "Restored persistent release.keystore from project repository."
          fi
          
          if [ ! -f "android/app/release.keystore" ]; then
            echo "Generating fallback production keystore..."
            keytool -genkeypair -v -keystore android/app/release.keystore \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=Dovashi, OU=Mobile, O=Nobo, L=Dhaka, ST=Dhaka, C=BD"
          fi
          
          echo "=================================================================="
          echo "           DOVASHI RELEASE APK SHA-1 FINGERPRINT"
          echo "=================================================================="
          keytool -list -v -keystore android/app/release.keystore -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | grep -E "SHA1|SHA256"
          echo "=================================================================="

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          validate-wrappers: false

      - name: Build Release APK with Gradle
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'dovashi' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'dovashi123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'dovashi123' }}
        run: |
          cd android
          gradle assembleRelease --no-daemon

      - name: Sign APK with V1, V2, V3 Schemes
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'dovashi' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'dovashi123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'dovashi123' }}
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          
          if [ -f "android/app/release.keystore" ] && [ -f "$APK_PATH" ]; then
            echo "Signing APK with full V1, V2, V3 signature protection..."
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
              --ks android/app/release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out Dovashi-Release.apk \
              "$APK_PATH"
            echo "Signed APK created: Dovashi-Release.apk"
          else
            echo "Copying unsigned APK..."
            cp "$APK_PATH" Dovashi-Release.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dovashi-Release-APK
          path: Dovashi-Release.apk
          retention-days: 30
