name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup System Utilities (Image Rasterizer)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y librsvg2-bin imagemagick

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Project Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Application
        run: npm run build

      - name: Setup Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Inject Full Android App Icons and Permissions
        run: |
          # 1. Update AndroidManifest.xml permissions
          python3 -c "
          import os
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              perms = '<uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n    <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />'
              if 'android.permission.RECORD_AUDIO' not in content:
                  content = content.replace('<application', perms + '\n    <application')
                  with open(manifest_path, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print('Permissions injected successfully')
          "

          # 2. Render & inject high-resolution AAPT2-compliant PNGs into all mipmap folders
          RES_DIR="android/app/src/main/res"

          declare -A DENSITIES=(
            ["mipmap-mdpi"]=48
            ["mipmap-hdpi"]=72
            ["mipmap-xhdpi"]=96
            ["mipmap-xxhdpi"]=144
            ["mipmap-xxxhdpi"]=192
          )

          for FOLDER in "${!DENSITIES[@]}"; do
            SIZE="${DENSITIES[$FOLDER]}"
            TARGET_PATH="$RES_DIR/$FOLDER"
            mkdir -p "$TARGET_PATH"
            
            # Generate standard launcher, round launcher, and foreground icons using standard rsvg
            rsvg-convert -w "$SIZE" -h "$SIZE" public/logo.svg -o "$TARGET_PATH/ic_launcher.png"
            rsvg-convert -w "$SIZE" -h "$SIZE" public/logo.svg -o "$TARGET_PATH/ic_launcher_round.png"
            rsvg-convert -w "$SIZE" -h "$SIZE" public/logo.svg -o "$TARGET_PATH/ic_launcher_foreground.png"
            echo "Generated valid AAPT2 PNG icons for $FOLDER (${SIZE}x${SIZE})"
          done

          # Copy vector foreground as fallback
          mkdir -p "$RES_DIR/drawable" "$RES_DIR/drawable-v24"
          if [ -f "assets/ic_launcher_foreground.xml" ]; then
            cp assets/ic_launcher_foreground.xml "$RES_DIR/drawable/ic_launcher_foreground.xml"
            cp assets/ic_launcher_foreground.xml "$RES_DIR/drawable-v24/ic_launcher_foreground.xml"
          fi

      - name: Enable ProGuard / R8 Obfuscation & App Protection
        run: |
          python3 -c "
          import os
          build_gradle = 'android/app/build.gradle'
          if os.path.exists(build_gradle):
              with open(build_gradle, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              # Enable minifyEnabled and shrinkResources for Release build
              if 'minifyEnabled false' in content:
                  content = content.replace('minifyEnabled false', 'minifyEnabled true\n            shrinkResources true')
              
              # Exclude duplicate kotlin modules
              exclude_rule = '''
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          '''
              if 'kotlin-stdlib-jdk7' not in content:
                  content += exclude_rule

              with open(build_gradle, 'w', encoding='utf-8') as f:
                  f.write(content)
              print('Enabled ProGuard/R8 code protection & obfuscation in build.gradle')

          # Add standard ProGuard security rules for Capacitor
          proguard_rules = 'android/app/proguard-rules.pro'
          if os.path.exists(proguard_rules):
              with open(proguard_rules, 'a', encoding='utf-8') as f:
                  f.write('''
          # Dovashi App Security & Anti-Decompile Protection Rules
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          -keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod
          -dontwarn org.apache.cordova.**
          -dontwarn com.getcapacitor.**
          -repackageclasses 'com.dovashi.security'
          -allowaccessmodification
          ''')
              print('Injected ProGuard security rules')
          "

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            echo "Keystore decoded successfully."
          else
            echo "Warning: KEYSTORE_BASE64 secret not found."
          fi

      - name: Build Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK with V1, V2, V3 Schemes
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'dovashi' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'dovashi123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'dovashi123' }}
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          
          if [ -f "android/app/release.keystore" ] && [ -f "$APK_PATH" ]; then
            echo "Signing APK with full V1, V2, V3 signature protection..."
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
              --ks android/app/release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out Dovashi-Release.apk \
              "$APK_PATH"
            echo "Signed APK created: Dovashi-Release.apk"
          else
            echo "Copying unsigned APK..."
            cp "$APK_PATH" Dovashi-Release.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dovashi-Release-APK
          path: Dovashi-Release.apk
          retention-days: 30
