<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- বাম বাবল গ্রেডিয়েন্ট: ভাইব্র্যান্ট ব্লু থেকে পার্পল -->
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    
    <!-- ডান বাবল গ্রেডিয়েন্ট: পিঙ্ক থেকে ওয়ার্ম অরেঞ্জ -->
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <!-- সফট থ্রিডি ড্রপ শ্যাডো -->
    <filter id="bubbleShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="-3" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- সলিড হোয়াইট ব্যাকগ্রাউন্ড ক্যানভাস (পারফেক্ট রাউন্ডেড কর্নার) -->
  <rect width="512" height="512" rx="112" fill="#FFFFFF" />

  <!-- বাম বাবল (ভয়েস ইনপুট - ব্লু/পার্পল) -->
  <path 
    d="M156,135 H284 A36,36 0 0,1 320,171 V259 A36,36 0 0,1 284,295 H180 L120,355 V171 A36,36 0 0,1 156,135 Z" 
    fill="url(#leftGrad)" 
  />
  
  <!-- ডান বাবল (এআই আউটপুট - পিঙ্ক/অরেঞ্জ উইথ শ্যাডো) -->
  <path 
    d="M259,205 H358 A34,34 0 0,1 392,239 V311 A34,34 0 0,1 358,345 H340 L380,385 V345 H259 A34,34 0 0,1 225,311 V239 A34,34 0 0,1 259,205 Z" 
    fill="url(#rightGrad)" 
    filter="url(#bubbleShadow)"
  />
  
  <!-- অডিও ওয়েভ লাইনস (গ্রিন) - বোল্ড এবং ক্রিস্প -->
  <line x1="160" y1="195" x2="160" y2="235" stroke="#10B981" stroke-width="14" stroke-linecap="round" />
  <line x1="188" y1="170" x2="188" y2="260" stroke="#10B981" stroke-width="14" stroke-linecap="round" />
  <line x1="216" y1="150" x2="216" y2="280" stroke="#10B981" stroke-width="14" stroke-linecap="round" />
  <line x1="244" y1="175" x2="244" y2="255" stroke="#10B981" stroke-width="14" stroke-linecap="round" />
  <line x1="272" y1="198" x2="272" y2="232" stroke="#10B981" stroke-width="14" stroke-linecap="round" />

  <!-- ট্রান্সলেটেড টেক্সট বার (পার্পল/ইন্ডিগো) -->
  <line x1="262" y1="288" x2="348" y2="288" stroke="#8B5CF6" stroke-width="15" stroke-linecap="round" />
  <line x1="262" y1="318" x2="310" y2="318" stroke="#8B5CF6" stroke-width="15" stroke-linecap="round" />

  <!-- এআই ম্যাজিক স্পার্কলস -->
  <!-- বড় স্পার্কল (গ্রিন) -->
  <path 
    d="M340,220 Q340,238 358,238 Q340,238 340,256 Q340,238 322,238 Q340,238 340,220 Z" 
    fill="#10B981" 
  />
  <!-- ছোট স্পার্কল (পার্পল) -->
  <path 
    d="M308,215 Q308,226 319,226 Q308,226 308,237 Q308,226 297,226 Q308,226 308,215 Z" 
    fill="#8B5CF6" 
  />
</svg>


