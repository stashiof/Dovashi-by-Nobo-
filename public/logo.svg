<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradSpine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="30%" stop-color="#7c3aed" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="gradOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="40%" stop-color="#ec4899" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="gradTopBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="gradBottomBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="#0f172a" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4" />

  <!-- D Outer Curve -->
  <path d="M120 70 Q 320 60 410 170 Q 470 260 410 350 Q 330 450 140 450 Q 280 430 350 350 Q 400 280 350 190 Q 280 110 120 70 Z" fill="url(#gradOuter)" filter="url(#shadow)" />

  <!-- D Left Spine & Leaf -->
  <path d="M100 70 Q 150 70 150 120 L 150 380 Q 150 440 90 440 Q 80 350 80 200 Q 80 70 100 70 Z" fill="url(#gradSpine)" filter="url(#shadow)" />
  
  <!-- Leaf element on lower left -->
  <path d="M90 440 C 90 410 130 390 150 360 C 170 410 130 450 90 440 Z" fill="#10b981" />

  <!-- Top Chat Bubble -->
  <g filter="url(#shadow)">
    <path d="M160 170 C 160 135 290 135 290 170 C 290 200 250 215 220 220 C 180 225 160 200 160 170 Z" fill="url(#gradTopBubble)" />
    <circle cx="195" cy="172" r="7" fill="#ffffff" />
    <circle cx="220" cy="172" r="7" fill="#ffffff" />
    <circle cx="245" cy="172" r="7" fill="#ffffff" />
  </g>

  <!-- Bottom Chat Bubble -->
  <g filter="url(#shadow)">
    <path d="M160 270 C 160 235 280 235 280 270 C 280 305 240 320 200 320 C 170 320 160 300 160 270 Z" fill="url(#gradBottomBubble)" />
    <circle cx="195" cy="272" r="7" fill="#0f172a" />
    <circle cx="220" cy="272" r="7" fill="#0f172a" />
    <circle cx="245" cy="272" r="7" fill="#0f172a" />
  </g>
</svg>
