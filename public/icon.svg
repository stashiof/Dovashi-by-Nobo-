<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- বাম বাবল: নীল (Blue) থেকে বেগুনি (Purple) -->
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    
    <!-- ডান বাবল: গোলাপি (Pink) থেকে কমলা (Orange) -->
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <!-- 3D ফ্লোটিং শ্যাডো: এটি ডানদিকের বাবলটিকে বামদিকেরটি থেকে সম্পূর্ণ আলাদা করে ভাসিয়ে রাখবে -->
    <filter id="floatShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-6" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Left Bubble (ভয়েস ইনপুট) -->
  <path 
    d="M140 140 H300 A40 40 0 0 1 340 180 V280 A40 40 0 0 1 300 320 H220 L140 380 V320 H140 A40 40 0 0 1 100 280 V180 A40 40 0 0 1 140 140 Z" 
    fill="url(#leftGrad)" 
  />
  
  <!-- Right Bubble (টেক্সট ও এআই আউটপুট) - শ্যাডো যুক্ত করা হয়েছে -->
  <path 
    d="M250 200 H370 A40 40 0 0 1 410 240 V340 A40 40 0 0 1 370 380 H330 V440 L250 380 H250 A40 40 0 0 1 210 340 V240 A40 40 0 0 1 250 200 Z" 
    fill="url(#rightGrad)" 
    filter="url(#floatShadow)"
  />
  
  <!-- "কথা বলা" বা অডিও ওয়েভ (বামদিকের বাবলে): সবুজ (Green) -->
  <line x1="170" y1="210" x2="170" y2="230" stroke="#10B981" stroke-width="12" stroke-linecap="round" />
  <line x1="195" y1="180" x2="195" y2="260" stroke="#10B981" stroke-width="12" stroke-linecap="round" />
  <line x1="220" y1="160" x2="220" y2="280" stroke="#10B981" stroke-width="12" stroke-linecap="round" />
  <line x1="245" y1="190" x2="245" y2="250" stroke="#10B981" stroke-width="12" stroke-linecap="round" />

  <!-- ট্রান্সলেটেড টেক্সট (ডানদিকের বাবলে): বেগুনি (Purple) -->
  <line x1="260" y1="290" x2="350" y2="290" stroke="#8B5CF6" stroke-width="14" stroke-linecap="round" />
  <line x1="260" y1="325" x2="310" y2="325" stroke="#8B5CF6" stroke-width="14" stroke-linecap="round" />

  <!-- "AI" নির্দেশক ম্যাজিক স্পার্কল (ডানদিকের বাবলে) -->
  <!-- বড় স্পার্কল: সবুজ (Green) -->
  <path 
    d="M350 230 Q350 250 370 250 Q350 250 350 270 Q350 250 330 250 Q350 250 350 230 Z" 
    fill="#10B981" 
  />
  <!-- ছোট স্পার্কল: বেগুনি (Purple) -->
  <path 
    d="M320 220 Q320 230 330 230 Q320 230 320 240 Q320 230 310 230 Q320 230 320 220 Z" 
    fill="#8B5CF6" 
  />
</svg>
